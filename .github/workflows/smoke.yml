name: Browser smoke test

on:
  push:
    branches: [main]
    paths:
      - index.html
      - style.css
      - src/**
      - tests/**
      - .github/workflows/smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test driver
        run: npm install --no-save --no-package-lock playwright@1.56.0
      - name: Serve static HTML
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/parallax-server.log 2>&1 &
          sleep 2
      - name: Run real Chromium smoke tests
        run: node tests/smoke.mjs
      - name: Upload viewport screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parallax-smoke-preview
          path: smoke-preview.png
          if-no-files-found: ignore
